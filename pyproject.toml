[project]
name = "automatic-illustration-colorization"
version = "0.1.0"
description = "Automatic illustration colorization pipeline and services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2"
]

[dependency-groups]
train = [
    "catboost>=1.2.5",
    "fire>=0.6.0",
    "mlflow>=2.16.2",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pytorch-lightning>=2.4.0",
    "scikit-learn>=1.5.2",
    "torch>=2.4.1",
]
api = [
    "fastapi>=0.115.2",
    "pydantic>=2.9.2",
    "python-multipart>=0.0.21",
    "uvicorn[standard]>=0.30.6",
]
bot = [
    "aiogram>=3.4.1,<4",
    "httpx>=0.27.2",
]
dev = [
    "black>=24.8.0",
    "flake8>=7.1.1",
    "isort>=5.13.2",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "ruff>=0.6.9",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["illustration_colorizer", "services", "shared"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["illustration_colorizer", "services", "shared"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
