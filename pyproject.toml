[project]
name = "automatic-illustration-colorization"
version = "0.1.0"
description = "Automatic illustration colorization pipeline and services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
]

[dependency-groups]
benchmark = [
    "catboost>=1.2.5",
    "datasets>=4.8.5",
    "fire>=0.6.0",
    "fastprogress>=1.0.3",
    "huggingface-hub>=0.25.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.16.2",
    "omegaconf>=2.3.0",
    "pandas>=2.2.2",
    "psutil>=6.1.0",
    "pytorch-lightning>=2.4.0",
    "safetensors>=0.4.5",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.2",
    "torch>=2.4.1",
    "torch-fidelity>=0.3.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.19.1",
]
model-ddcolor = [
    "huggingface-hub>=0.25.0",
    "safetensors>=0.4.5",
    "scikit-image>=0.24.0",
    "scipy>=1.14.0",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "tqdm>=4.66.0",
]
model-deoldify = [
    "fastai>=2.7.18",
    "fastprogress>=1.0.3",
    "huggingface-hub>=0.25.0",
    "matplotlib>=3.9.0",
    "requests>=2.32.0",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
]
model-colorcomic = [
    "accelerate>=0.28",
    "diffusers>=0.27",
    "einops>=0.7",
    "gdown>=5.0",
    "huggingface-hub>=0.25.0",
    "kornia>=0.7",
    "opencv-contrib-python-headless>=4.9",
    "python-dotenv>=1.0",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "transformers>=4.40",
]
model-cgan = [
    "scikit-image>=0.24.0",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
]
model-cobra = [
    "accelerate>=1.5.2",
    "datasets>=3.2.0",
    "einops>=0.8.1",
    "huggingface-hub>=0.30.2",
    "matplotlib>=3.10.1",
    "pandas>=2.2.0",
    "peft>=0.15.0",
    "safetensors>=0.5.3",
    "sentencepiece>=0.2.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "transformers>=4.48.3,<5",
]
api = [
    "fastapi>=0.115.2",
    "pydantic>=2.9.2",
    "python-multipart>=0.0.21",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.6",
]
bot = [
    "aiogram>=3.4.1,<4",
    "asyncpg>=0.30.0",
    "httpx>=0.27.2",
    "redis>=5.0.0",
]
worker = [
    "redis>=5.0.0",
]
dev = [
    "black>=24.8.0",
    "flake8>=7.1.1",
    "ipykernel>=7.2.0",
    "isort>=5.13.2",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "ruff>=0.6.9",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["illustration_colorizer", "services", "shared"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["illustration_colorizer", "services", "shared"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises real model backends and local artifacts",
]
